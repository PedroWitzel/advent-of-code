name: Rust Setup
description: Install Rust toolchain and restore Cargo cache

inputs:
  components:
    description: Comma-separated extra rustup components to install
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust stable
      shell: bash
      run: |
        rustup toolchain install stable \
          --profile minimal \
          ${{ inputs.components != '' && format('--component {0}', inputs.components) || '' }} \
          --no-self-update
        rustup default stable
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
        echo "CARGO_TERM_COLOR=always" >> $GITHUB_ENV

    - name: Print toolchain version
      shell: bash
      run: |
        rustc --version --verbose
        echo "### Rust toolchain" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        rustc --version --verbose >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Cache Cargo registry and build artifacts
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
