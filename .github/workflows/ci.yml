name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          components: clippy,rustfmt

      - name: Clippy
        run: |
          # convert clippy diagnostics to GitHub inline PR annotations
          cargo clippy --locked --message-format=json 2>/dev/null \
            | jq -r '
                select(.reason == "compiler-message")
                | select(.message.level == "warning" or .message.level == "error")
                | .message as $m
                | $m.spans[0] as $s
                | "::\($m.level) file=\($s.file_name),line=\($s.line_start),endLine=\($s.line_end),col=\($s.column_start),title=clippy::\($m.message)"
              ' \
            | tee /dev/stderr \
            | grep -q "^::error" && exit 1 || exit 0

      - name: Format check
        run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/rust-setup

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  # aggregator job — set branch protection on this one name only
  ci:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - run: echo "All checks passed"
