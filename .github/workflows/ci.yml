name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable with clippy and rustfmt
        run: |
          # ubuntu-latest ships rustup; install the stable toolchain explicitly
          rustup toolchain install stable \
            --profile minimal \
            --component clippy,rustfmt \
            --no-self-update
          rustup default stable
          # disable incremental compilation (speeds up CI, irrelevant for caching)
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          echo "CARGO_TERM_COLOR=always" >> $GITHUB_ENV

      - name: Print toolchain version
        run: |
          rustc --version --verbose
          echo "### Rust toolchain" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          rustc --version --verbose >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # cache is busted when Cargo.lock changes; os prefix avoids cross-runner collisions
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          # fall back to any cache from the same OS if lock changed
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: |
          # emit JSON so we can convert each diagnostic to a GitHub inline annotation
          cargo clippy --locked --message-format=json 2>/dev/null \
            | jq -r '
                select(.reason == "compiler-message")
                | select(.message.level == "warning" or .message.level == "error")
                | .message as $m
                | $m.spans[0] as $s
                | "::\($m.level) file=\($s.file_name),line=\($s.line_start),endLine=\($s.line_end),col=\($s.column_start),title=clippy::\($m.message)"
              ' \
            | tee /dev/stderr \
            | grep -q "^::error" && exit 1 || exit 0

      - name: Format check
        run: cargo fmt --check
